<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="goal"><div id="goal" class="tile"></div><div class="gtxt"><b>TARGET</b><span id="gname"></span><small>⏱ <b id="timeNow">0:00</b> &nbsp; 🏅 <b id="timeBest">--</b></small></div></div>
    <div class="scores">
      <div class="box"><span>SCORE</span><b id="score">0</b></div>
      <div class="box"><span>BEST</span><b id="best">0</b></div>
    </div>
  </header>
  <div class="bar">
    <button id="undo">Undo</button>
    <button id="new">New</button>
    <button id="snd" aria-label="Sound">🔊</button>
  </div>
  <div class="opts">
    <label>Colours <select id="theme"></select></label>
    <label>Tiles <select id="tileset"></select></label>
    <label>Sound <select id="sndpack"></select></label>
  </div>
  <div id="board" aria-label="Game board"></div>
  <div id="toast" role="status"></div>
  <div id="overlay" hidden><div><h2 id="msg"></h2><button id="again">Play again</button><button id="keep" hidden>Keep going</button></div></div>
  <p class="hint">Swipe or use arrow keys</p>
</main>
<script src="lib/three.min.js"></script>
<script src="core3d.js"></script>
<script src="specs3d.js"></script>
<script src="models3d.js"></script>
<script src="photos_orig.js"></script>
<script src="photos_food.js"></script>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
